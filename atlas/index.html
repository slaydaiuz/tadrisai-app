<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D anatomiya atlasi · TadrisAI</title>
<meta name="description" content="Bepul 3D anatomiya atlasi: skelet, mushaklar, yurak, bosh miya, nafas va hazm a'zolari, tishlar va qon tomirlar. Aylantiring, qismlarga ajrating, har bir qismning o'zbekcha, ruscha va lotincha nomini o'rganing.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1124">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<style>
:root{--bg:#0B1124;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--text:#F1F5F9;--muted:#94A3B8;--v:#8B5CF6;--b:#3B82F6;--ok:#22C55E;--bad:#EF4444;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
/* bo'limlar ro'yxati */
#home{position:fixed;inset:0;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
#home:before{content:"";position:fixed;inset:-30% -30% auto auto;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.25),transparent 65%);z-index:-1;pointer-events:none}
.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto}
.top a{color:var(--muted);text-decoration:none;font-size:14px}
.sp{flex:1}
.langs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.langs button{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.langs button.on{background:var(--v);color:#fff}
.hero{max-width:880px;margin:26px auto 18px}
.hero h1{font-size:clamp(26px,5.5vw,38px);line-height:1.15;margin:0 0 8px;letter-spacing:-.3px}
.hero h1 b{background:linear-gradient(90deg,var(--v),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#CBD5E1;font-size:16px;line-height:1.5}
.badge{display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:99px;background:rgba(239,68,68,.15);color:#FCA5A5;font-size:12px;font-weight:700}
.grid{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;transition:transform .15s,background .15s}
.sec:active{transform:scale(.98)}
.sec:hover{background:var(--card2)}
.sec .ic{font-size:34px;line-height:1}
.sec b{display:block;margin-top:10px;font-size:16px}
.sec small{display:block;margin-top:3px;color:var(--muted);font-size:13px}
.credit{max-width:880px;margin:26px auto 0;color:var(--muted);font-size:12px;line-height:1.5}
/* ko'ruvchi */
#view{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(11,17,36,.95),rgba(11,17,36,0));pointer-events:none}
.bar>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:rgba(15,23,42,.8);border:1px solid var(--line);font-size:14px;font-weight:600;backdrop-filter:blur(8px)}
.ttl{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.tools button{width:44px;height:44px;border-radius:13px;background:rgba(15,23,42,.8);border:1px solid var(--line);font-size:18px;backdrop-filter:blur(8px)}
.tools button.on{background:var(--v);border-color:var(--v)}
.tabs{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 52px);display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(15,23,42,.8);border:1px solid var(--line)}
.tabs button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--v);color:#fff}
.exp{position:absolute;left:12px;right:66px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 0px);display:flex;align-items:center;gap:10px}
.exp input{flex:1;accent-color:var(--v)}
.panel{position:absolute;left:10px;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 44px);max-width:560px;margin:0 auto;background:rgba(15,23,42,.92);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;backdrop-filter:blur(10px)}
.panel h3{margin:0;font-size:18px;line-height:1.25}
.panel .lat{margin-top:3px;color:#C4B5FD;font-style:italic;font-size:14px}
.panel .alt{margin-top:2px;color:var(--muted);font-size:13px}
.chip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:700;color:#CBD5E1;vertical-align:middle;font-style:normal}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:11px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.btn.pri{background:linear-gradient(90deg,var(--v),var(--b));border:0;color:#fff}
.btn.sm{flex:0;min-width:0;padding:11px 14px}
.hint{color:var(--muted);font-size:13px;margin:0}
/* qismlar ro'yxati */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,92vw);background:rgba(11,17,36,.97);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px 12px;transform:translateX(100%);transition:transform .25s;z-index:5}
.drawer.on{transform:none}
.drawer input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none;margin:10px 0}
.list{overflow-y:auto;flex:1}
.list button{display:block;width:100%;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
.list button small{display:block;color:var(--muted);font-size:12px;font-style:italic}
/* viktorina */
.qz{position:absolute;left:10px;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 100px);max-width:560px;margin:0 auto;background:rgba(15,23,42,.92);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:center;backdrop-filter:blur(10px)}
.qz b{font-size:17px}
.qz .res{margin-top:6px;font-weight:700}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--v);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.lock{position:fixed;inset:0;display:grid;place-items:center;padding:20px;text-align:center}
.lock div{max-width:380px}
.lock a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:linear-gradient(90deg,var(--v),var(--b));color:#fff;text-decoration:none;font-weight:700}
@media (min-width:900px){.panel{left:auto;right:70px;margin:0;width:420px}.exp{right:auto;width:360px}}
</style>
</head>
<body>
<div id="lock" class="lock hide"><div><div style="font-size:44px">🫀</div><h2 id="lkT"></h2><p class="hint" id="lkD"></p><a href="/" id="lkB"></a></div></div>

<div id="home" class="hide">
  <div class="top"><a href="/" id="hBack"></a><div class="sp"></div><div class="langs" id="langs"></div></div>
  <div class="hero"><span class="badge" id="hBadge"></span><h1 id="hT"></h1><p id="hD"></p></div>
  <div class="grid" id="grid"></div>
  <p class="credit" id="credit"></p>
</div>

<div id="view" class="hide">
  <canvas id="cv"></canvas>
  <div class="load" id="load"><div><div class="spin"></div><span id="loadT"></span></div></div>
  <div class="bar"><button class="pill" id="vBack"></button><div class="ttl" id="vT"></div><div class="sp"></div><button class="pill" id="vList">☰</button></div>
  <div class="tabs" id="tabs"><button data-t="learn" class="on" id="tLearn"></button><button data-t="quiz" id="tQuiz"></button></div>
  <div class="tools">
    <button id="bReset" title="">⟲</button>
    <button id="bColor" title="">🎨</button>
    <button id="bPlay" title="">⇄</button>
    <button id="bIn" title="">+</button>
    <button id="bOut" title="">−</button>
    <button id="bFull" title="">⛶</button>
  </div>
  <div class="exp"><span>🔩</span><input type="range" id="exp" min="0" max="100" value="0"></div>
  <div class="panel" id="panel">
    <p class="hint" id="pHint"></p>
  </div>
  <div class="qz hide" id="qz"></div>
  <div class="drawer" id="drawer"><div style="display:flex;align-items:center"><b id="dT"></b><div class="sp"></div><button class="pill" id="dX">✕</button></div>
    <input id="dQ" autocomplete="off"><div class="list" id="dL"></div></div>
</div>
<script type="module" src="atlas.js?v=1"></script>
</body>
</html>
