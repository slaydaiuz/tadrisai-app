<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TadrisAI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#5D45F5; --violet:#8B5CF6; --blue:#3B82F6;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
:root[data-theme="dark"]{
  --bg:#0F172A; --text:#F8FAFC; --muted:#94A3B8;
  --surface:rgba(30,41,74,.55); --surface-solid:#172036; --line:rgba(148,163,184,.16);
  --field:#131C38; --chip:rgba(93,69,245,.18); --chip-text:#C4B5FD;
  --blob-a:#5D45F5; --blob-b:#8B5CF6; --blob-c:#3B82F6; --blob-op:.55;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --bg:#F8FAFC; --text:#0F172A; --muted:#64748B;
  --surface:rgba(255,255,255,.78); --surface-solid:#FFFFFF; --line:#E5E7EB;
  --field:#FFFFFF; --chip:#EDE9FE; --chip-text:#5B3FE0;
  --blob-a:#A5B4FC; --blob-b:#C4B5FD; --blob-c:#93C5FD; --blob-op:.7;
  --shadow:0 18px 40px -22px rgba(30,27,75,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Onest',system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}

/* ---------- Animated background ---------- */
.sky{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;overflow:hidden;z-index:0;pointer-events:none;contain:strict}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-op);will-change:transform}
.b1{width:360px;height:360px;background:var(--blob-a);top:-140px;left:-120px;animation:drift1 44s ease-in-out infinite alternate}
.b2{width:300px;height:300px;background:var(--blob-b);top:30%;right:-150px;animation:drift2 52s ease-in-out infinite alternate}
.b3{width:280px;height:280px;background:var(--blob-c);bottom:-120px;left:10%;animation:drift3 60s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(120px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-110px,-70px) scale(.9)}}
@keyframes drift3{to{transform:translate(90px,-110px) scale(1.2)}}
:root[data-theme="dark"] .sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 0,rgba(15,23,42,.35) 70%)}

.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 16px 110px}

/* ---------- Header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.logo{height:42px;width:auto;display:block;color:var(--text);overflow:visible}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,70%,100%{transform:scale(1) rotate(0)}80%{transform:scale(1.35) rotate(45deg)}90%{transform:scale(.85) rotate(90deg)}}
.hdr-right{display:flex;gap:8px}
.icon-btn{height:38px;min-width:38px;padding:0 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang-wrap{position:relative}
.lang-menu{position:absolute;right:0;top:46px;min-width:168px;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);display:none;z-index:20}
.lang-menu.open{display:block}
.lang-item{display:flex;justify-content:space-between;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
.lang-item:hover{background:var(--chip)}
.lang-item.active{color:var(--chip-text);font-weight:600}
.lang-item small{color:var(--muted)}

/* ---------- Greeting ---------- */
.greet h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.greet p{color:var(--muted);margin-top:6px}
.role-sw{display:inline-flex;gap:4px;margin-top:16px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.role-sw button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13.5px;color:var(--muted);transition:background .25s,color .25s}
.role-sw button b{font-weight:600}
.role-sw button[aria-pressed="true"]{background:linear-gradient(120deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 8px 18px -8px rgba(93,69,245,.9)}

/* ---------- Primary tools ---------- */
.tools{display:grid;gap:12px;margin-top:22px}
.tool{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .15s ease}
.tool:active{transform:scale(.98)}
.tool::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(130deg,rgba(93,69,245,.9),rgba(139,92,246,.2) 40%,transparent 60%,rgba(59,130,246,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tool-ic{flex:none;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--indigo),var(--violet));box-shadow:0 10px 22px -10px rgba(93,69,245,.9)}
.tool-ic.blue{background:linear-gradient(140deg,var(--blue),var(--indigo))}
.tool h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tool p{font-size:13px;color:var(--muted);margin-top:2px}
.tool .go{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-text)}

/* animated icons */
.ai-ic{width:30px;height:30px;color:#fff;overflow:visible}
.ai-ic .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 2.8s ease-in-out infinite}
.ai-ic .bar:nth-of-type(2){animation-delay:.15s}.ai-ic .bar:nth-of-type(3){animation-delay:.3s}
@keyframes grow{0%,15%{transform:scaleY(.35)}45%,80%{transform:scaleY(1)}100%{transform:scaleY(.35)}}
.ai-ic .ln{stroke-dasharray:12;stroke-dashoffset:12;animation:write 3.2s ease-in-out infinite}
.ai-ic .ln:nth-of-type(2){animation-delay:.35s}.ai-ic .ln:nth-of-type(3){animation-delay:.7s}
@keyframes write{0%,10%{stroke-dashoffset:12}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:12}}
.ai-ic .tick{stroke-dasharray:10;stroke-dashoffset:10;animation:write2 3s ease-in-out infinite}
.ai-ic .tick:nth-of-type(2){animation-delay:.4s}
@keyframes write2{0%,15%{stroke-dashoffset:10}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:10}}
.ai-ic .page{transform-box:fill-box;transform-origin:left;animation:flip 3.4s ease-in-out infinite}
@keyframes flip{0%,55%,100%{transform:rotateY(0)}75%{transform:skewY(-6deg) scaleX(.8)}}

/* ---------- Secondary list ---------- */
.sec-title{font-size:13px;color:var(--muted);font-weight:600;margin:26px 2px 10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row-ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--chip-text)}
.row-ic svg{width:20px;height:20px}
.txt b{display:block;font-size:14.5px;font-weight:600}
.txt i{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.soon{margin-left:auto;flex:none;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--chip-text)}

.site{margin-top:12px;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);color:#fff;
  background:linear-gradient(120deg,#3B82F6,#5D45F5 55%,#8B5CF6);background-size:200% 200%;animation:pan 9s ease-in-out infinite alternate}
@keyframes pan{to{background-position:100% 50%}}
.site .txt b{font-size:15px}
.site .txt i{color:#fff;opacity:.85}
.site .btn{margin-left:auto;flex:none;padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.18);font-weight:600;font-size:13px;color:#fff}

/* ---------- Form ---------- */
.screen{display:none}.screen.on{display:block}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;margin-bottom:14px}
.form-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.form-head h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
.form-head p{color:var(--muted);font-size:13.5px}
.seg-label{font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 6px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;transition:border-color .2s,background .2s}
.seg3 button[aria-pressed="true"]{border-color:var(--violet);background:var(--chip);color:var(--chip-text)}
.flag{width:22px;height:22px;flex:none;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.flag .shine{transform-box:fill-box;transform-origin:center;animation:fshine 3.6s ease-in-out infinite;opacity:.9}
@keyframes fshine{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.seg3 button[aria-pressed="true"] .flag{animation:fbob 2.4s ease-in-out infinite}
@keyframes fbob{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-8deg) scale(1.12)}}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border:2px solid var(--line);border-radius:12px;padding:4px;background:var(--surface);text-align:left;transition:border-color .2s,transform .15s}
.th:active{transform:scale(.97)}
.th[aria-pressed="true"]{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.th .mini{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px}
.th .mini .l{flex:1.5;padding:9% 0 0 8%;display:flex;flex-direction:column;gap:5%}
.th .mini .k{width:30%;height:5%;border-radius:2px}
.th .mini .t1{width:64%;height:11%;border-radius:3px}
.th .mini .t2{width:44%;height:11%;border-radius:3px}
.th .mini .c{position:absolute;right:7%;top:16%;width:30%;aspect-ratio:1;border-radius:50%}
.th .mini .p{position:absolute;right:0;bottom:0;width:38%;height:34%;border-top-left-radius:8px;display:flex;gap:6%;padding:6% 8%;box-sizing:border-box}
.th .mini .p i{flex:1;border-radius:3px}
.th b{display:block;font-size:11px;margin:4px 2px 1px}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pick2 button{display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center;padding:7px 10px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);text-align:left}
.pick2 button b{font-size:12.5px}
.pick2 button span:not(.ie){grid-column:1/-1;font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.pick2 .ie{font-size:15px}
.pick2 button[aria-pressed="true"]{border-color:var(--violet);background:var(--chip)}
.themes-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.themes-wrap.open{grid-template-rows:1fr}
.themes-wrap>.themes{overflow:hidden;min-height:0;padding:0 3px;opacity:0;visibility:hidden;transition:opacity .3s,padding .4s,visibility 0s .4s}
.themes-wrap.open>.themes{padding:3px;opacity:1;visibility:visible;transition:opacity .3s,padding .4s,visibility 0s}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);text-align:left}
.imgs button b{font-size:13px}
.imgs button span:not(.ie){font-size:11px;color:var(--muted);line-height:1.3}
.imgs .ie{font-size:18px}
.imgs .from{font-size:11px;font-weight:700;color:var(--chip-text);margin-top:3px}
.rng{position:relative;height:74px;margin:58px 12px 0}
.rng-track{position:absolute;left:0;right:0;top:11px;height:6px;border-radius:6px;background:var(--line)}
.rng-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.rng-tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.rng-tick b{position:absolute;top:-24px;font-size:13px;color:var(--muted)}
.rng-tick i{display:block;width:14px;height:14px;margin-top:7px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.rng-tick.on i{background:var(--violet)}
.rng-tick span{margin-top:9px;font-size:11px;color:var(--muted);white-space:nowrap}
.rng-tick.cur b{color:var(--text)} .rng-tick.cur span{color:var(--chip-text);font-weight:800;font-size:12px}
.rng-tick .fr{color:#10B981!important;font-weight:700}
.rng input{position:absolute;left:-12px;right:-12px;width:calc(100% + 24px);top:0;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.rng input::-webkit-slider-runnable-track{background:transparent;height:28px}
.rng input::-moz-range-track{background:transparent}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(139,92,246,.35),0 4px 10px rgba(0,0,0,.35);cursor:pointer;margin-top:1px}
.rng input::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(139,92,246,.35)}
.rng-bub{position:absolute;top:-56px;transform:translateX(-50%);background:var(--violet);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap;pointer-events:none}
.rng-price{text-align:center;font-size:14px;color:var(--muted);margin-top:4px} .rng-price b{color:var(--chip-text);font-size:17px}
.imgs button{position:relative}
.imgs .tag.pop{background:linear-gradient(120deg,#10B981,#F59E0B);animation:popglow 2.6s ease-in-out infinite}
@keyframes popglow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}50%{box-shadow:0 0 10px 1px rgba(245,158,11,.55)}}
.imgs .tag{position:absolute;top:7px;right:7px;font-style:normal;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:99px;background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff}
[data-img="premium"] .ie{animation:gem 2.6s ease-in-out infinite}
@keyframes gem{0%,100%{transform:rotate(0) scale(1);filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{transform:rotate(-10deg) scale(1.18);filter:drop-shadow(0 0 6px rgba(139,92,246,.9))}}
.sent-ic span{display:inline-block}
.sent-ic.wait span{animation:hourglass 2.4s ease-in-out infinite}
@keyframes hourglass{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.sent-ic.file span{animation:fileup 1.8s ease-in-out infinite}
@keyframes fileup{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px) rotate(-6deg)}}
.sent-ic{position:relative}
.sent-ic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--violet);opacity:0;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.free-hint{display:none;margin-top:8px;font-size:12.5px;color:var(--chip-text);background:var(--chip);padding:8px 12px;border-radius:12px}
.free-hint.on{display:block}
.ie{display:inline-block;transform-origin:50% 60%}
[data-img="art"] .ie{animation:pencil 2.6s ease-in-out infinite;transform-origin:20% 90%}
@keyframes pencil{0%,100%{transform:rotate(0) translate(0,0)}20%{transform:rotate(-12deg) translate(2px,-1px)}40%{transform:rotate(6deg) translate(4px,0)}60%{transform:rotate(-10deg) translate(1px,-1px)}80%{transform:rotate(0) translate(0,0)}}
[data-img="photo"] .ie{animation:snap 3s ease-in-out infinite}
@keyframes snap{0%,70%,100%{transform:scale(1);filter:brightness(1)}76%{transform:scale(.86)}80%{transform:scale(1.12);filter:brightness(1.8) drop-shadow(0 0 6px #fff)}88%{transform:scale(1);filter:brightness(1)}}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.25) rotate(20deg);opacity:.75}}
[data-pick="auto"] .ie{animation:robot 2.8s ease-in-out infinite}
@keyframes robot{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(-8deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-2px) rotate(8deg)}}
[data-pick="own"] .ie{animation:palette 4s linear infinite}
@keyframes palette{0%{transform:rotate(0)}25%{transform:rotate(14deg)}50%{transform:rotate(0)}75%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
.seg .e,.role-sw span{display:inline-block;animation:wave 3.2s ease-in-out infinite;transform-origin:50% 80%}
@keyframes wave{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.imgs button[aria-pressed="true"]{border-color:var(--violet);background:var(--chip)}
.img-info{display:none;margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--chip);color:var(--chip-text);font-size:13px;line-height:1.45}
.img-info.on{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.seg button{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:12px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,background .2s}
.seg button .e{font-size:20px}
.seg button b{display:block;font-size:14px;margin-top:4px}
.seg button span{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.seg button[aria-pressed="true"]{border-color:var(--violet);background:var(--chip)}
.fields{display:grid;gap:12px;margin-top:18px}
.group{font-size:13px;font-weight:600;color:var(--muted);margin:26px 2px 12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 2px 6px}
.field input{width:100%;padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--field);color:var(--text);font:inherit;font-size:16px;outline:none}
.field input:focus{border-color:var(--violet);background:var(--field)}
.field input{position:relative;z-index:1}
.field input::placeholder{color:var(--muted);opacity:.75}
.field .check{display:flex;align-items:center;gap:10px;margin:2px 2px 0;font-size:14.5px;color:var(--text);cursor:pointer}
.field .check input{width:20px;height:20px;padding:0;accent-color:var(--violet);flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:46px;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--field);font-size:20px;font-weight:600}
.stepper output{flex:1;text-align:center;font-size:20px;font-weight:700}
.plan{margin-top:6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2 button{display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center;padding:8px 11px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);text-align:left;color:var(--text)}
.seg2 .e{font-size:16px} .seg2 b{font-size:13px} .seg2 span:not(.e){grid-column:1/-1;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.seg2 button[aria-pressed="true"]{border-color:var(--violet);background:var(--chip)}
[data-plan="ai"] .e{display:inline-block;animation:robot 2.8s ease-in-out infinite}
[data-plan="own"] .e{display:inline-block;animation:pencil 2.6s ease-in-out infinite;transform-origin:20% 90%}
.opt-toggle .chev{display:inline-block}

  place(L.req,$('reqFields'),false); place(L.opt,$('optFields'),true);
  if(mode==='prez'){const sv=+store.get('size'); size=(sv>=SMIN&&sv<=SMAX)?sv:10}
  step(0); $('freeHint').classList.toggle('on',FREE>0); syncCity(); syncDocLang(); renderPlan(); setDens(dens); toggleOpt(optOn);
  $('cta').textContent=t(mode==='prez'?'ctaPrez':'ctaIsh'); syncDesign();
}
const SAVE=['fUni','fName','fGrp','fTea','fCity','fFak','fYon','fCls'];
function submitForm(){
  if(mode==='prez'&&img==='premium'){showInfo('💎',t('imgPrem'),t('soonMsg'));return}
  saveFields();
  if(mode==='prez'&&KNOWN&&!UNL&&!isFree(size)&&BALANCE<priceOf(size,img)){
    openTopup(priceOf(size,img)-BALANCE);return}
  const L=layout(), used=new Set([...L.req,...(optOn?L.opt:[])].map(x=>x[0]));   // belgisiz qo'shimchalar yuborilmaydi
  const v=id=>used.has(id)?$(id).value.trim():'';
  const missing=L.req.filter(([id])=>id!=='size'&&!$(id).value.trim());
  document.querySelectorAll('.field.err').forEach(f=>f.classList.remove('err'));
  if(missing.length){
    missing.forEach(([id])=>{const w=$('w-'+id); w.classList.remove('err'); void w.offsetWidth; w.classList.add('err')});
    const first=$(missing[0][0]); first.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>first.focus(),350);
    toast('✍️',t('fill'));
    try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('error')}catch(e){}
    return}
  let plan=[];
  if(mode==='prez'&&planMode==='own'){
    const inputs=[...document.querySelectorAll('#planInputs input')];
    plan=inputs.map(i=>i.value.trim()).filter(Boolean);
    if(plan.length<inputs.length){
      inputs.forEach(i=>{if(!i.value.trim()){i.style.borderColor='#EF4444'}});
      inputs.find(i=>!i.value.trim()).focus(); toast('✍️',t('planFill')); return}
  }
  const who=mode==='ish'?'student':as;
  const data={mode,lang,doc_lang:mode==='prez'?docLang:lang,theme:(img==='art'&&pick==='own')?theme:'auto',img,as:who,role,topic:v('fMav'),size,subject:v('fFan'),
    university:v('fUni'),faculty:v('fFak'),direction:v('fYon'),grade:v('fCls'),group:v('fGrp'),
    student:who==='student'?v('fName'):'',teacher:who==='teacher'?v('fName'):v('fTea'),
    city:(used.has('city')&&$('cityOn').checked)?$('fCity').value.trim():'', plan, extra:optOn, dens:mode==='prez'?dens:'full'};
  sendToBot(data,'⏳',t('sentTitle'),t('sentText'));
}

/* ---------- Botga yuborish (Telegram oynani o'zi yopadi) ---------- */
let pending=null;
function sendToBot(data,ic,title,text){
  if(!(tg&&tg.platform&&tg.platform!=='unknown')){showInfo('📱','TadrisAI',t('notTg'));return}
  pending=data;
  $('sentIc').innerHTML='<span>'+ic+'</span>'; $('sentIc').className='sent-ic '+(ic==='⏳'?'wait':'file'); $('sentTitle').textContent=title; $('sentText').textContent=text; $('sentBtn').textContent=t('sentBtn');
  $('sent').classList.add('on');
  try{tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}
}
function flushSend(){
  if(!pending) return;
  const d=pending; pending=null;
  try{tg.sendData(JSON.stringify(d))}catch(e){}
  setTimeout(()=>{show('home');showInfo('⚠️','TadrisAI',t('wrongOpen'))},2500);
}
function sentClose(){if(pending)flushSend();else $('sent').classList.remove('on')}
function showInfo(ic,title,text){
  pending=null;
  $('sentIc').innerHTML='<span>'+ic+'</span>'; $('sentIc').className='sent-ic file';
  $('sentTitle').textContent=title; $('sentText').textContent=text; $('sentBtn').textContent=t('sentBtn');
  $('sent').classList.add('on');
}

/* ---------- Fayllarim ---------- */
function loadFiles(){
  const f=qs.get('f'); if(!f) return [];
  try{
    const b=atob(f.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((f.length+3)%4));
    const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes))||[];
  }catch(e){return []}
}
const FILES=loadFiles();
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderFiles(){
  const now=Date.now(), items=FILES.map(([id,name,kind,day])=>{
    const left=Math.max(0,30-Math.floor((now-new Date(day+'T00:00:00').getTime())/864e5));
    return {id,name,kind,day,left};
  }).filter(x=>x.left>0);
  $('fempty').style.display=items.length?'none':'';
  $('fnote').style.display=items.length?'':'none';
  $('flist').innerHTML=items.map(x=>`<div class="fitem"><span class="fi">${x.kind==='p'?'📊':'📄'}</span>
    <span class="ft"><b>${esc(x.name)}</b><i>${t(x.kind==='p'?'fPrez':'fIsh')} · ${x.day.split('-').reverse().join('.')} · ${x.left} ${t('fLeft')}</i></span>
    <button type="button" onclick="resend(${Number(x.id)})">${t('fSend')}</button></div>`).join('');
}
function resend(id){sendToBot({mode:'resend',id},'📁',t('resTitle'),t('resText'))}

/* ---------- Profile / role ---------- */
function setRole(r){role=r;store.set('role',r);renderAll()}
function accToggle(b){b.closest('.acc').classList.toggle('open')}
function openDoc(n){
  const u=new URL(n+'.html',location.href).href;
  try{if(tg&&tg.openLink){tg.openLink(u);return}}catch(e){}
  window.open(u,'_blank');
}
function renderProfile(){
  $('profName').textContent=userName||'';
  $('roleNow').textContent=t(role==='teacher'?'teacher':'student'); renderWallet();
  $('roleStudent').setAttribute('aria-pressed',role==='student');
  $('roleTeacher').setAttribute('aria-pressed',role==='teacher');
}

/* ---------- Navigation ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  const sub=['topup','invite','paywait','payok'].includes(id);
  if(id!=='paywait') stopPoll();
  ['home','files','profile'].forEach(n=>$('nav-'+n).classList.toggle('on',n===id||(id==='form'&&n==='home')||(sub&&n==='profile')));
  document.querySelector('nav').style.display=(id==='form'||sub)?'none':'';
  window.scrollTo(0,0);
}
function soon(){showInfo('✨',t('soonTag'),t('soonMsg'))}
let toastT=null;
function toast(ic,text){
  const el=$('toast'); el.innerHTML='<span class="ti">'+ic+'</span><span>'+esc(text)+'</span>';
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2800);
}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#optFields'))syncOptSub()});
document.addEventListener('input',e=>{const w=e.target.closest&&e.target.closest('.field.err'); if(w&&e.target.value.trim()) w.classList.remove('err')});

/* ---------- Language & theme ---------- */
function renderAll(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('langCode').textContent=lang.toUpperCase();
  document.querySelectorAll('.lang-item').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
  renderHome(); renderForm(); renderProfile(); renderFiles();
}
const menu=$('langMenu');
Object.entries(LANGS).forEach(([k,n])=>{const b=document.createElement('button');b.className='lang-item';b.dataset.l=k;b.innerHTML=`<span>${n}</span><small>${k.toUpperCase()}</small>`;b.onclick=()=>{lang=k;store.set('lang',k);menu.classList.remove('open');renderAll()};menu.appendChild(b)});
$('langBtn').onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap'))menu.classList.remove('open')});

const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>';
function setTheme(th){document.documentElement.dataset.theme=th;store.set('theme',th);$('themeBtn').innerHTML=th==='dark'?MOON:SUN;
  try{tg&&tg.setHeaderColor&&tg.setHeaderColor(th==='dark'?'#0F172A':'#F8FAFC');tg&&tg.setBackgroundColor&&tg.setBackgroundColor(th==='dark'?'#0F172A':'#F8FAFC')}catch(e){}}
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- Start ---------- */
try{if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}}catch(e){}
setTheme(qs.get('theme')||store.get('theme')||'dark');
/* Forma maydonlarini eslab qolish: qurilmada (localStorage) va Telegram bulutida (CloudStorage) */
const CS=(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'))?tg.CloudStorage:null;
function saveFields(){
  SAVE.forEach(id=>{const v=$(id).value.trim(); store.set('f_'+id,v); try{CS&&CS.setItem('f_'+id,v)}catch(e){}});
  const c=$('cityOn').checked?'1':''; store.set('cityOn',c); try{CS&&CS.setItem('cityOn',c||'0')}catch(e){}
}
SAVE.forEach(id=>{const x=store.get('f_'+id);if(x)$(id).value=x});
let saveT=null;
SAVE.forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(saveT);saveT=setTimeout(saveFields,800)}));
try{CS&&CS.getItems(SAVE.map(id=>'f_'+id).concat(['cityOn']),(err,vals)=>{
  if(err||!vals) return;
  SAVE.forEach(id=>{const v=vals['f_'+id]; if(v&&!$(id).value.trim()){$(id).value=v; store.set('f_'+id,v)}});
  if(vals.cityOn==='1'&&!$('cityOn').checked){$('cityOn').checked=true; syncCity()}
})}catch(e){}
$('cityOn').checked=!!store.get('cityOn');
buildThemes();
renderAll();
renderPlan();
if(qs.get('screen')) show(qs.get('screen'));
if(qs.get('form')) openForm(qs.get('form'));
</script>
<div class="toast" id="toast"></div>
<div class="sent" id="sent"><div class="sent-card">
  <div class="sent-ic" id="sentIc"><span>⏳</span></div>
  <b id="sentTitle"></b>
  <p id="sentText"></p>
  <button class="cta" type="button" onclick="sentClose()" id="sentBtn"></button>
</div></div>
</body>
